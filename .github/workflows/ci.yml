name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Boot dev services (postgres, kafka, debezium server)
        run: pnpm db:up
        timeout-minutes: 5

      - name: Run migrations (tables, roles, RLS policies)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://eventform:eventform@localhost:5432/eventform

      # The deterministic suite (no Kafka roundtrip) is the blocking gate. The
      # full CDC pipeline e2e is excluded here and covered by the Playwright
      # smoke job below; run it locally with `pnpm --filter @eventform/worker test:pipeline`.
      - name: Run all tests
        run: pnpm test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            **/test-results/**
            **/junit*.xml
            **/vitest-*.xml
          retention-days: 7

  smoke:
    name: Playwright Smoke (non-blocking)
    runs-on: ubuntu-latest
    # This job intentionally continues-on-error while the e2e setup is being
    # stabilized. Promote to a required check once the full prod-mode boot
    # (api + worker from dist) is wired up in CI.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Boot dev services
        run: pnpm db:up
        timeout-minutes: 5

      - name: Run migrations (tables, roles, RLS policies)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://eventform:eventform@localhost:5432/eventform

      # Debezium Server starts streaming automatically when `db:up` brings it up
      # healthy — there is no connector to register.

      - name: Start webhook sink (smoke test delivery target)
        run: |
          node -e 'require("http").createServer((q,s)=>{let b="";q.on("data",c=>b+=c);q.on("end",()=>s.end("ok"))}).listen(9099,"127.0.0.1")' &
          echo "SINK_PID=$!" >> "$GITHUB_ENV"

      - name: Start API in background
        run: |
          pnpm --filter @eventform/api start &
          echo "API_PID=$!" >> "$GITHUB_ENV"
        env:
          PORT: "3001"
          DATABASE_URL_API: postgres://app_api@localhost:5432/eventform
          DATABASE_URL: postgres://eventform:eventform@localhost:5432/eventform
          AUTH_MODE: dev
          CORS_ORIGINS: "http://localhost:5173"

      - name: Start Worker in background
        run: |
          pnpm --filter @eventform/worker start &
          echo "WORKER_PID=$!" >> "$GITHUB_ENV"
        env:
          WORKER_PORT: "3002"
          DATABASE_URL_WORKER: postgres://app_worker@localhost:5432/eventform
          DATABASE_URL: postgres://eventform:eventform@localhost:5432/eventform
          KAFKA_BROKERS: localhost:29092

      - name: Wait for API + Worker to be ready
        run: |
          for svc in "API:3001" "Worker:3002"; do
            name="${svc%%:*}"; port="${svc##*:}"
            ready=""
            for i in $(seq 1 30); do
              if curl -fs "http://localhost:${port}/health" > /dev/null 2>&1; then
                echo "${name} ready"; ready=1; break
              fi
              echo "waiting for ${name}... ($i/30)"; sleep 2
            done
            [ -n "$ready" ] || { echo "${name} never became healthy"; exit 1; }
          done
          # The worker's consumer uses fromBeginning:false — give it time to join
          # the group before we submit, so the submission's event isn't missed.
          echo "letting the consumer group settle..."; sleep 15

      - name: Install Playwright Chromium
        run: pnpm --filter @eventform/web exec playwright install chromium --with-deps

      - name: Run Playwright smoke tests
        run: pnpm --filter @eventform/web exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
