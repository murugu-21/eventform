name: Deploy Web (Cloudflare Pages)

# The SPA is deployed to Cloudflare Pages — a global CDN that stays up
# independently of the VPS/API. Frontend deploys are decoupled from the Docker
# image pipeline (deploy.yml): this runs on web changes pushed to main, builds
# the static bundle, and uploads it with Wrangler. The API base URL and OAuth
# config are baked in at build time from repository Variables.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-web.yml"

jobs:
  deploy:
    name: Build & deploy SPA to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    # Secrets aren't allowed in `if:` directly, so map to an env var and gate on
    # it — an unconfigured Cloudflare account posts a notice and exits cleanly
    # (mirrors the VPS gate in deploy.yml).
    env:
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'yes' || '' }}

    steps:
      - name: Check Cloudflare secrets are configured
        id: gate
        run: |
          if [ -z "$CF_CONFIGURED" ]; then
            echo "::notice title=Web deploy skipped::CLOUDFLARE_API_TOKEN is not set. " \
              "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the 'production' environment to enable Pages deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.gate.outputs.skip == 'false'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps (web only)
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile --filter @eventform/web...

      - name: Build SPA
        if: steps.gate.outputs.skip == 'false'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH_MODE: ${{ vars.VITE_AUTH_MODE }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_REDIRECT_URI: ${{ vars.VITE_REDIRECT_URI }}
        run: pnpm --filter @eventform/web build

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=eventform --branch=main
