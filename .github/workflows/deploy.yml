name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/eventform

jobs:
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch: the prod box is Graviton (ARM64); local/dev is amd64/arm64.
      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (tag + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}-worker:latest
            ${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/db/Dockerfile.migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}-migrate:latest
            ${{ env.IMAGE_PREFIX }}-migrate:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Run migrations against Neon from CI — once per release, before rollout — so a
  # bad migration fails the pipeline rather than the box, and the EC2 instances no
  # longer run migrations on every boot. (Secrets aren't allowed in `if:`, so we
  # map to an env var and gate on it; absent secret => notice + clean skip.)
  migrate:
    name: Migrate Neon
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    env:
      MIGRATE_CONFIGURED: ${{ secrets.NEON_DATABASE_URL != '' && 'yes' || '' }}
    steps:
      - name: Check NEON_DATABASE_URL is configured
        id: gate
        run: |
          if [ -z "$MIGRATE_CONFIGURED" ]; then
            echo "::notice title=Migrations skipped::NEON_DATABASE_URL is not set. " \
              "Add it (Neon owner, DIRECT endpoint) to the 'production' environment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: Setup pnpm
        if: steps.gate.outputs.skip == 'false'
        uses: pnpm/action-setup@v4
      - name: Setup Node
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (db package only)
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile --filter @eventform/db...
      - name: Run migrations
        if: steps.gate.outputs.skip == 'false'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: pnpm db:migrate

  # Roll the EC2 ASG to the freshly-built images via an instance refresh. With a
  # single instance (max 1) this is terminate-then-launch — the new box's userdata
  # pulls the new images and `compose up`. Brief downtime during the cold start.
  rollout:
    name: Roll out to EC2 ASG
    runs-on: ubuntu-latest
    needs: [build-push, migrate]
    environment: production
    env:
      AWS_CONFIGURED: ${{ secrets.AWS_ACCESS_KEY_ID != '' && 'yes' || '' }}
    steps:
      - name: Check AWS credentials are configured
        id: gate
        run: |
          if [ -z "$AWS_CONFIGURED" ]; then
            echo "::notice title=Rollout skipped::AWS_ACCESS_KEY_ID is not set. " \
              "Add AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (and the AWS_REGION variable) to enable ASG rollout."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials
        if: steps.gate.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Start ASG instance refresh
        if: steps.gate.outputs.skip == 'false'
        run: |
          ASG=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?contains(AutoScalingGroupName,'ComputeStack')].AutoScalingGroupName" \
            --output text)
          [ -n "$ASG" ] || { echo "::error::No ComputeStack ASG found"; exit 1; }
          aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG" \
            --preferences '{"MinHealthyPercentage":0,"InstanceWarmup":300}'
          echo "Instance refresh started for $ASG (new box pulls ${{ needs.build-push.outputs.image-tag }})"
