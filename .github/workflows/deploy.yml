name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/eventform

jobs:
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch: the prod box is Graviton (ARM64); local/dev is amd64/arm64.
      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract Docker metadata (tag + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}-worker:latest
            ${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/db/Dockerfile.migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}-migrate:latest
            ${{ env.IMAGE_PREFIX }}-migrate:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Run migrations against Neon from CI — once per release, before rollout — so a
  # bad migration fails the pipeline rather than the box, and the EC2 instances no
  # longer run migrations on every boot. (Secrets aren't allowed in `if:`, so we
  # map to an env var and gate on it; absent secret => notice + clean skip.)
  migrate:
    name: Migrate Neon
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    env:
      MIGRATE_CONFIGURED: ${{ secrets.NEON_DATABASE_URL != '' && 'yes' || '' }}
    steps:
      - name: Check NEON_DATABASE_URL is configured
        id: gate
        run: |
          if [ -z "$MIGRATE_CONFIGURED" ]; then
            echo "::notice title=Migrations skipped::NEON_DATABASE_URL is not set. " \
              "Add it (Neon owner, DIRECT endpoint) to the 'production' environment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        if: steps.gate.outputs.skip == 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install (db package only)
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile --filter @eventform/db...
      - name: Run migrations
        if: steps.gate.outputs.skip == 'false'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: pnpm db:migrate

  # Roll the EC2 ASG to the freshly-built images via an instance refresh. With a
  # single instance (max 1) this is terminate-then-launch — the new box's userdata
  # pulls the new images and `compose up`. Brief downtime during the cold start.
  rollout:
    name: Roll out to EC2 ASG
    runs-on: ubuntu-latest
    needs: [build-push, migrate]
    environment: production
    # OIDC: mint a short-lived token to assume the AWS deploy role — no static keys.
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOY_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Check the OIDC deploy role is configured
        id: gate
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "::notice title=Rollout skipped::AWS_ROLE_ARN variable is not set. " \
              "Deploy ComputeStack, then set its GithubDeployRoleArn output as the AWS_ROLE_ARN repo/environment variable to enable ASG rollout."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials (OIDC — no static keys)
        if: steps.gate.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Start ASG instance refresh
        if: steps.gate.outputs.skip == 'false'
        run: |
          ASG=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?contains(AutoScalingGroupName,'ComputeStack')].AutoScalingGroupName" \
            --output text)
          [ -n "$ASG" ] || { echo "::error::No ComputeStack ASG found"; exit 1; }
          aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG" \
            --preferences '{"MinHealthyPercentage":0,"InstanceWarmup":300}'
          echo "Instance refresh started for $ASG (new box pulls ${{ needs.build-push.outputs.image-tag }})"
