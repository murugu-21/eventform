# Local prod smoke-test override. Runs the prod stack locally in dev-auth mode,
# exposing:
#   :8081  → API directly (dev auth mode; no Caddy, no tunnel locally)
#   :15432 → postgres (for running migrations + bootstrap)
# The SPA is served by Cloudflare Pages in real prod; for a local smoke test
# point a Vite dev server (VITE_API_URL=http://localhost:8081) at the API.
#
# Usage:
#   export DB_ADMIN_PASSWORD=localdev APP_API_PASSWORD=localdev APP_WORKER_PASSWORD=localdev
#   export SECRET_ENC_KEY=$(head -c 32 /dev/urandom | base64)
#   docker compose -p eventform-prod \
#     -f infra/compose/docker-compose.prod.yml \
#     -f infra/compose/docker-compose.prod-local.override.yml \
#     up -d --build
#
# Tear down: docker compose -p eventform-prod down -v

name: eventform-prod

services:
  postgres:
    # Publish postgres locally so migrations can run from the host
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: eventform
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: eventform

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      AUTH_MODE: dev
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8081"
      # app_api is created password-less by migration 0001_rls.sql (trust auth locally)
      DATABASE_URL_API: postgres://app_api@postgres:5432/eventform
      DATABASE_URL: postgres://eventform:localdev@postgres:5432/eventform
      COGNITO_ISSUER: ""
      COGNITO_CLIENT_ID: ""
    # Expose API directly so a local SPA / curl can reach http://localhost:8081
    ports:
      - "127.0.0.1:8081:3001"

  worker:
    environment:
      # app_worker is created password-less by migration 0001_rls.sql (trust auth locally)
      DATABASE_URL_WORKER: postgres://app_worker@postgres:5432/eventform
      DATABASE_URL: postgres://eventform:localdev@postgres:5432/eventform

  migrate:
    environment:
      DATABASE_URL: postgres://eventform:localdev@postgres:5432/eventform

  connect-init:
    environment:
      DB_ADMIN_PASSWORD: localdev
    # Override entrypoint: substitute the DB password at runtime.
    # The dev connector JSON hardcodes 'eventform' for database.password but the local
    # prod stack uses DB_ADMIN_PASSWORD (localdev). We replace the specific field.
    entrypoint: >
      sh -c '
        set -e
        echo "registering connector (db password substituted)..."
        CONFIG=$$(sed "s/\"database.password\": \"eventform\"/\"database.password\": \"$$DB_ADMIN_PASSWORD\"/" /connector/eventform-outbox.json)
        curl -fsS -X PUT \
          -H "Content-Type: application/json" \
          --data "$$CONFIG" \
          http://connect:8083/connectors/eventform-outbox/config
        echo "connector registered"
      '
