# x-required-env: document every ${VAR} used in this file
#
#   DB_ADMIN_PASSWORD        postgres superuser password (POSTGRES_PASSWORD)
#   APP_API_PASSWORD         password for the app_api role
#   APP_WORKER_PASSWORD      password for the app_worker role
#   SECRET_ENC_KEY           base64-encoded 32-byte AES-256 key for endpoint-secret encryption
#   COGNITO_ISSUER           https://cognito-idp.<region>.amazonaws.com/<poolId>
#   COGNITO_CLIENT_ID        Cognito app client id
#   TUNNEL_TOKEN             Cloudflare Tunnel token (Zero Trust -> Networks -> Tunnels)
#   BACKUP_S3_BUCKET         from BackupStack output (eventform-backups-<account>)
#   BACKUP_AWS_ACCESS_KEY_ID / BACKUP_AWS_SECRET_ACCESS_KEY
#                            access key for the eventform-backup IAM user (PutObject-only)
#
# Optional overrides (have defaults):
#   AWS_REGION               default: us-east-1 (backup service only)

name: eventform-prod

services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: eventform
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: eventform
    # No published port in prod — access via docker exec or override file
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eventform -d eventform"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Kafka-API broker. Redpanda (C++, single process, no JVM) in place of
  # Apache Kafka for resource footprint — kafkajs and Debezium speak the same
  # protocol and can't tell the difference.
  kafka:
    image: redpandadata/redpanda:v25.3.15
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
      - --set
      - redpanda.log_retention_ms=86400000
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    # No published port in prod — the broker is internal only
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  connect:
    image: quay.io/debezium/connect:3.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: eventform-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms256m
    # No published port in prod
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  connect-init:
    # One-shot: registers the Debezium connector via the REST API.
    # Retries until connect is ready, then exits.
    image: curlimages/curl:8.11.0
    restart: "no"
    depends_on:
      connect:
        condition: service_healthy
    environment:
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - ./connect:/connector:ro
    entrypoint: >
      sh -c '
        set -e
        CONFIG=$$(cat /connector/eventform-outbox-prod.json | sed "s/\$${DB_ADMIN_PASSWORD}/$$DB_ADMIN_PASSWORD/g")
        curl -fsS -X PUT \
          -H "Content-Type: application/json" \
          --data "$$CONFIG" \
          http://connect:8083/connectors/eventform-outbox/config
        echo "connector registered"
      '

  api:
    image: ghcr.io/murugu-21/eventform-api:latest
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3001"
      DATABASE_URL_API: postgres://app_api:${APP_API_PASSWORD}@postgres:5432/eventform
      DATABASE_URL: postgres://eventform:${DB_ADMIN_PASSWORD}@postgres:5432/eventform
      AUTH_MODE: cognito
      COGNITO_ISSUER: ${COGNITO_ISSUER}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      CORS_ORIGINS: https://eventform.murugappan.dev
      SECRET_ENC_KEY: ${SECRET_ENC_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    image: ghcr.io/murugu-21/eventform-worker:latest
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      WORKER_PORT: "3002"
      DATABASE_URL_WORKER: postgres://app_worker:${APP_WORKER_PASSWORD}@postgres:5432/eventform
      DATABASE_URL: postgres://eventform:${DB_ADMIN_PASSWORD}@postgres:5432/eventform
      # NOTE: Use the in-network PLAINTEXT listener (kafka:9092), not the external one (29092)
      KAFKA_BROKERS: kafka:9092
      SECRET_ENC_KEY: ${SECRET_ENC_KEY}

  migrate:
    # One-shot migration runner. Run with: docker compose -f docker-compose.prod.yml run --rm migrate
    # Or use profile: docker compose -f docker-compose.prod.yml --profile setup up migrate
    image: ghcr.io/murugu-21/eventform-migrate:latest
    build:
      context: ../..
      dockerfile: packages/db/Dockerfile.migrate
    profiles: ["setup"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eventform:${DB_ADMIN_PASSWORD}@postgres:5432/eventform

  backup:
    # Nightly pg_dump to the append-only S3 bucket (BackupStack). The ONLY
    # real AWS credential on the box — scoped to s3:PutObject on one prefix.
    image: ghcr.io/murugu-21/eventform-backup:latest
    build:
      context: ../..
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: eventform
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
      PGDATABASE: eventform
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}

  cloudflared:
    # Outbound-only tunnel to Cloudflare's edge. The API public hostname maps
    # directly to http://api:3001 in the Zero Trust dashboard (see DEPLOYMENT.md)
    # — no reverse proxy needed; the SPA is on Cloudflare Pages. No inbound ports.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redpanda_data:
