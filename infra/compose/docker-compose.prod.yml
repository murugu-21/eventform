# x-required-env: document every ${VAR} used in this file
#
#   DATABASE_URL             Neon owner connection (DIRECT endpoint, sslmode=require)
#                            — used by migrations and Debezium CDC. NOT the -pooler host.
#   DATABASE_URL_API         Neon app_api connection (RLS role; pooled endpoint is fine)
#   DATABASE_URL_WORKER      Neon app_worker connection (BYPASSRLS role; pooled is fine)
#   SECRET_ENC_KEY           base64-encoded 32-byte AES-256 key for endpoint-secret encryption
#   COGNITO_ISSUER           https://cognito-idp.<region>.amazonaws.com/<poolId>
#   COGNITO_CLIENT_ID        Cognito app client id
#   TUNNEL_TOKEN             Cloudflare Tunnel token (Zero Trust -> Networks -> Tunnels)
#
# Postgres is hosted on Neon (managed, with PITR backups) — there is no local
# Postgres or pg_dump/S3 backup service here. Roles' passwords are applied from
# env via `pnpm db:roles` / bootstrap.sh (see DEPLOYMENT.md).

name: eventform-prod

services:
  # Kafka-API broker. Redpanda (C++, single process, no JVM) in place of
  # Apache Kafka for resource footprint — kafkajs and Debezium speak the same
  # protocol and can't tell the difference. Sized for a 2 GB box (t4g.small).
  kafka:
    image: redpandadata/redpanda:v25.3.15
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
      - --set
      - redpanda.log_retention_ms=86400000
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Debezium Server: one process, embedded engine → Kafka. No Connect cluster,
  # no REST registration, no connect-* topics, no init container. The connector
  # is the env config below; the wrapper entrypoint parses the Neon DATABASE_URL
  # into the source DB fields (sslmode=require). Offsets persist to a file on a
  # volume — the Neon replication slot is the real durability buffer.
  debezium:
    image: quay.io/debezium/server:3.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sh", "/debezium/entrypoint.sh"]
    volumes:
      - ./debezium/entrypoint.sh:/debezium/entrypoint.sh:ro
      - debezium_data:/debezium/data
    environment:
      JAVA_OPTS: -Xmx384m -Xms256m
      # Source DB creds are parsed from DATABASE_URL by the wrapper entrypoint.
      DATABASE_URL: ${DATABASE_URL}
      DEBEZIUM_SOURCE_DATABASE_SSLMODE: require
      # Sink: Kafka (Redpanda). json format → StringSerializer writes plain JSON.
      DEBEZIUM_SINK_TYPE: kafka
      DEBEZIUM_SINK_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:9092
      DEBEZIUM_SINK_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      DEBEZIUM_SINK_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      DEBEZIUM_SOURCE_CONNECTOR_CLASS: io.debezium.connector.postgresql.PostgresConnector
      DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME: /debezium/data/offsets.dat
      DEBEZIUM_SOURCE_OFFSET_FLUSH_INTERVAL_MS: "0"
      DEBEZIUM_SOURCE_TOPIC_PREFIX: eventform
      DEBEZIUM_SOURCE_PLUGIN_NAME: pgoutput
      DEBEZIUM_SOURCE_SLOT_NAME: eventform_outbox
      DEBEZIUM_SOURCE_PUBLICATION_NAME: eventform_outbox_pub
      DEBEZIUM_SOURCE_PUBLICATION_AUTOCREATE_MODE: filtered
      DEBEZIUM_SOURCE_SNAPSHOT_MODE: no_data
      DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST: public.outbox
      DEBEZIUM_SOURCE_TOMBSTONES_ON_DELETE: "false"
      # Outbox EventRouter SMT: route by aggregate_type, expand the JSON payload
      # into the message value (schemas off → plain JSON bytes).
      DEBEZIUM_TRANSFORMS: outbox
      DEBEZIUM_TRANSFORMS_OUTBOX_TYPE: io.debezium.transforms.outbox.EventRouter
      DEBEZIUM_TRANSFORMS_OUTBOX_TABLE_FIELD_EVENT_ID: id
      DEBEZIUM_TRANSFORMS_OUTBOX_TABLE_FIELD_EVENT_KEY: aggregate_id
      DEBEZIUM_TRANSFORMS_OUTBOX_TABLE_FIELD_EVENT_PAYLOAD: payload
      DEBEZIUM_TRANSFORMS_OUTBOX_TABLE_EXPAND_JSON_PAYLOAD: "true"
      DEBEZIUM_TRANSFORMS_OUTBOX_ROUTE_BY_FIELD: aggregate_type
      DEBEZIUM_TRANSFORMS_OUTBOX_ROUTE_TOPIC_REPLACEMENT: eventform.events
      DEBEZIUM_FORMAT_KEY: json
      DEBEZIUM_FORMAT_KEY_SCHEMAS_ENABLE: "false"
      DEBEZIUM_FORMAT_VALUE: json
      DEBEZIUM_FORMAT_VALUE_SCHEMAS_ENABLE: "false"

  api:
    image: ghcr.io/murugu-21/eventform-api:latest
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      DATABASE_URL_API: ${DATABASE_URL_API}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_MODE: cognito
      COGNITO_ISSUER: ${COGNITO_ISSUER}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      CORS_ORIGINS: https://eventform.murugappan.dev
      SECRET_ENC_KEY: ${SECRET_ENC_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    image: ghcr.io/murugu-21/eventform-worker:latest
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      WORKER_PORT: "3002"
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER}
      DATABASE_URL: ${DATABASE_URL}
      # NOTE: Use the in-network PLAINTEXT listener (kafka:9092), not the external one (29092)
      KAFKA_BROKERS: kafka:9092
      SECRET_ENC_KEY: ${SECRET_ENC_KEY}

  migrate:
    # One-shot migration runner. Run with: docker compose -f docker-compose.prod.yml run --rm migrate
    # Or use profile: docker compose -f docker-compose.prod.yml --profile setup up migrate
    image: ghcr.io/murugu-21/eventform-migrate:latest
    build:
      context: ../..
      dockerfile: packages/db/Dockerfile.migrate
    profiles: ["setup"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  cloudflared:
    # Outbound-only tunnel to Cloudflare's edge. The API public hostname maps
    # directly to http://api:3001 in the Zero Trust dashboard (see DEPLOYMENT.md)
    # — no reverse proxy needed; the SPA is on Cloudflare Pages. No inbound ports.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy

volumes:
  redpanda_data:
  debezium_data:
