name: eventform

services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: eventform
      POSTGRES_DB: eventform
      # Local dev only: bound to 127.0.0.1, so trust auth lets app_api/app_worker
      # (created password-less by the migration) connect with no password. No dev
      # credentials anywhere; prod uses real per-role passwords from env.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eventform -d eventform"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Kafka-API broker. Redpanda (C++, single process, no JVM/controller split)
  # in place of Apache Kafka purely for resource footprint — clients (kafkajs,
  # Debezium) speak the same protocol and can't tell the difference.
  kafka:
    image: redpandadata/redpanda:v25.3.15
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:29092
      - --set
      - redpanda.auto_create_topics_enabled=true
      - --set
      - redpanda.log_retention_ms=86400000
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Debezium Server: a single self-contained process that streams the outbox via
  # the embedded engine straight to Kafka — no Connect cluster, no REST API, no
  # connect-* internal topics, no registration step. The whole connector is the
  # env config below (the EventRouter SMT routes outbox rows → eventform.events).
  # Offsets live in a file on a volume (the replication slot is the real durability
  # buffer; the offset file just records how far the engine has read).
  debezium:
    image: quay.io/debezium/server:3.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      JAVA_OPTS: -Xmx384m -Xms256m
      # Sink: Kafka (Redpanda). Producer talks the in-network listener. The
      # serializers must be set explicitly — the json format emits strings, so
      # StringSerializer writes the same UTF-8 JSON bytes Connect's converters did.
      DEBEZIUM_SINK_TYPE: kafka
      DEBEZIUM_SINK_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:9092
      DEBEZIUM_SINK_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      DEBEZIUM_SINK_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      # Source: Postgres outbox via pgoutput logical replication.
      DEBEZIUM_SOURCE_CONNECTOR_CLASS: io.debezium.connector.postgresql.PostgresConnector
      DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME: /debezium/data/offsets.dat
      DEBEZIUM_SOURCE_OFFSET_FLUSH_INTERVAL_MS: "0"
      DEBEZIUM_SOURCE_TOPIC_PREFIX: eventform
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: postgres
      DEBEZIUM_SOURCE_DATABASE_PORT: "5432"
      DEBEZIUM_SOURCE_DATABASE_USER: eventform
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: eventform
      DEBEZIUM_SOURCE_DATABASE_DBNAME: eventform
      DEBEZIUM_SOURCE_PLUGIN_NAME: pgoutput
      DEBEZIUM_SOURCE_SLOT_NAME: eventform_outbox
      DEBEZIUM_SOURCE_PUBLICATION_NAME: eventform_outbox_pub
      DEBEZIUM_SOURCE_PUBLICATION_AUTOCREATE_MODE: filtered
      DEBEZIUM_SOURCE_SNAPSHOT_MODE: no_data
      DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST: public.outbox
      DEBEZIUM_SOURCE_TOMBSTONES_ON_DELETE: "false"
      # Outbox EventRouter SMT: unwrap the row, route by aggregate_type, expand
      # the JSON payload into the message value (schemas off → plain JSON bytes).
      DEBEZIUM_TRANSFORMS: outbox
      DEBEZIUM_TRANSFORMS_OUTBOX_TYPE: io.debezium.transforms.outbox.EventRouter
      DEBEZIUM_TRANSFORMS_OUTBOX_TABLE_FIELD_EVENT_ID: id
      DEBEZIUM_TRANSFORMS_OUTBOX_TABLE_FIELD_EVENT_KEY: aggregate_id
      DEBEZIUM_TRANSFORMS_OUTBOX_TABLE_FIELD_EVENT_PAYLOAD: payload
      DEBEZIUM_TRANSFORMS_OUTBOX_TABLE_EXPAND_JSON_PAYLOAD: "true"
      DEBEZIUM_TRANSFORMS_OUTBOX_ROUTE_BY_FIELD: aggregate_type
      DEBEZIUM_TRANSFORMS_OUTBOX_ROUTE_TOPIC_REPLACEMENT: eventform.events
      DEBEZIUM_FORMAT_KEY: json
      DEBEZIUM_FORMAT_KEY_SCHEMAS_ENABLE: "false"
      DEBEZIUM_FORMAT_VALUE: json
      DEBEZIUM_FORMAT_VALUE_SCHEMAS_ENABLE: "false"
    volumes:
      - debezium_data:/debezium/data

volumes:
  pgdata:
  debezium_data:
